openapi: 3.1.0
info:
  title: Elova private backend API
  version: 1.3.0
  description: Canonical contract between the public VPS BFF and the private GX10 PostgreSQL-backed service.
servers:
  - url: /v1
    description: Relative server URL; private deployment origins are never contract data.
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/LivenessResponse" }
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/ReadinessResponse" }
        "503": { $ref: "#/components/responses/ReadinessResponse" }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "200":
          description: Signed owner session established.
          headers:
            Set-Cookie: { schema: { type: string } }
            X-Elova-Api-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session revoked. }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current signed owner session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: Owned workspaces, plus globally accessible workspaces for the super administrator, and the active session workspace.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, activeWorkspaceId]
                properties:
                  activeWorkspaceId: { type: [string, "null"], format: uuid }
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: New workspace created and selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces/select:
    post:
      operationId: selectWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: Session switched to an authorized workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeWorkspaceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces/settings:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    patch:
      operationId: renameWorkspace
      description: Only a workspace owner, admin, or global super administrator may rename the selected workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "204": { description: Workspace renamed. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces/members:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      operationId: listWorkspaceMembers
      description: Only a workspace owner or global super administrator may list memberships.
      responses:
        "200":
          description: Confirmed members and their per-workspace roles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: addWorkspaceMember
      description: Owner or global super administrator attaches only an already-provisioned exact user identity. Never creates a login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "204": { description: Existing user attached. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeWorkspaceMemberRole
      description: Owner or global super administrator changes an existing member role; transfer designation first to demote the designated owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/MemberRole" }
      responses:
        "204": { description: Member role changed. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: removeWorkspaceMember
      description: Owner or global super administrator removes a member; cannot remove the designated last owner.
      responses:
        "204": { description: Member removed and their selected sessions for this workspace cleared. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /workspaces/ownership/transfer:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    post:
      operationId: transferWorkspaceOwnership
      description: Owner or global super administrator designates an existing owner member to preserve the at-least-one-owner invariant before removing or demoting the prior designated owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        "204": { description: Designated owner transferred. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /providers:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      operationId: listProviders
      description: Any current workspace member or global super administrator; returns summaries, never credentials.
      responses:
        "200":
          description: Immutable n8n provider identities.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createProvider
      description: Only a workspace owner, admin or global super administrator may add a connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, baseUrl, apiKey]
              properties:
                name: { type: string, maxLength: 120 }
                baseUrl: { type: string, format: uri, maxLength: 2048 }
                apiKey: { type: string, maxLength: 4096 }
      responses:
        "201":
          description: Provider connection created with encrypted credentials.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /providers/{providerId}/sync:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    post:
      operationId: synchronizeProvider
      description: Only a workspace owner, admin or global super administrator may run the secret-bearing sync.
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sanitized workflow and execution evidence synchronized.
          content:
            application/json:
              schema:
                type: object
                required: [workflows, executions]
                properties:
                  workflows: { type: integer, minimum: 0 }
                  executions: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /workflows:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      operationId: listWorkflows
      description: Sanitized read for any current member or global super administrator; no workflow write operation exists.
      responses:
        "200":
          description: Sanitized workflow summaries.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /executions:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      operationId: listExecutions
      description: Sanitized read for any current member or global super administrator.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Sanitized execution summaries.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /dashboard/metrics:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      operationId: getDashboardMetrics
      description: Sanitized aggregate read for any current member or global super administrator.
      responses:
        "200":
          description: Execution outcome metrics from PostgreSQL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardMetrics" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
components:
  parameters:
    WorkspaceId:
      name: x-elova-workspace-id
      in: header
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: elova_session
  headers:
    ApiVersion:
      description: Major private API contract version.
      schema: { type: string, const: "1" }
    RequestId:
      description: Opaque correlation identifier; contains no endpoint or secret material.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    LivenessResponse:
      description: The backend process can serve requests.
      headers:
        X-Elova-Api-Version: { $ref: "#/components/headers/ApiVersion" }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Liveness" }
    ReadinessResponse:
      description: PostgreSQL and ordered migrations readiness.
      headers:
        X-Elova-Api-Version: { $ref: "#/components/headers/ApiVersion" }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Readiness" }
    ErrorResponse:
      description: Stable non-sensitive error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: live }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: false
          required: [database, migrations]
          properties:
            database: { type: string, enum: [ready, not_ready] }
            migrations: { type: string, enum: [ready, not_ready] }
    Owner:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, workspaceId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [user, super_admin] }
        workspaceId: { type: [string, "null"], format: uuid }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer, super_admin] }
        createdAt: { type: string, format: date-time }
    MemberRole:
      type: string
      enum: [owner, admin, editor, viewer]
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
    Session:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/Owner" }
    Provider:
      type: object
      additionalProperties: false
      required: [id, name, baseUrl, status, createdAt, lastSyncedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
    DashboardMetrics:
      type: object
      additionalProperties: false
      required: [totalExecutions, successfulExecutions, failedExecutions, successRate, averageDurationMs]
      properties:
        totalExecutions: { type: integer, minimum: 0 }
        successfulExecutions: { type: integer, minimum: 0 }
        failedExecutions: { type: integer, minimum: 0 }
        successRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        averageDurationMs: { type: [integer, "null"], minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
            message: { type: string, minLength: 1, maxLength: 160 }
    BffFailure:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [BACKEND_UNAVAILABLE, BACKEND_TIMEOUT] }
            message: { type: string, enum: [Service temporarily unavailable, Service timed out] }
security:
  - ownerSession: []
